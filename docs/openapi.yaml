openapi: 3.1.0
info:
  title: Nubmark API
  version: 0.1.0
  description: >-
    Flask foundation for the optional cloud service. Only liveness is implemented.
    Authentication, user-owned resources, persistence, and sync are not available.
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Check process liveness
      description: Does not check database or storage readiness.
      responses:
        '200':
          description: Process is serving requests.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    const: ok
        default:
          $ref: '#/components/responses/Error'
components:
  headers:
    RequestId:
      description: Server-generated identifier for this request.
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: HTTP error with a safe message and request identifier.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [code, message, requestId]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Uppercase HTTP status name with spaces replaced by underscores.
          examples: [NOT_FOUND, METHOD_NOT_ALLOWED, INTERNAL_SERVER_ERROR]
        message:
          type: string
        requestId:
          type: string
          format: uuid
